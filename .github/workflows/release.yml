name: Release

# Two entry points. The usual one is release-on-merge.yml, which tags the merge
# of a release/vX.Y.Z PR into main and then calls this workflow: a tag pushed
# with GITHUB_TOKEN does not fire `push` workflows, so that path cannot rely on
# the tag trigger below. The tag trigger stays for a tag pushed by hand.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      # Whoever can push a tag can otherwise publish any commit. Only a commit
      # already on main -- which a human approved into it -- may be released,
      # and its CHANGELOG must carry the section the tag names.
      - name: Check the tag is releasable
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi
          if ! grep -qF "## [${TAG#v}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md at $TAG has no '## [${TAG#v}]' section"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned to a minor line: patch releases are picked up automatically,
          # a minor bump is not. GoReleaser's cask template is what produces
          # Casks/capigo.rb in the tap, so an unreviewed minor bump silently
          # changes the published cask.
          version: "~> v2.18"
          install-only: true

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Remove stale Formula from tap (Cask is canonical)
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          SHA=$(curl -sf -H "Authorization: token $TAP_GITHUB_TOKEN" \
            https://api.github.com/repos/vtech-com/homebrew-tap/contents/capigo.rb \
            | jq -r '.sha // empty')
          if [ -n "$SHA" ]; then
            curl -sf -X DELETE \
              -H "Authorization: token $TAP_GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/vtech-com/homebrew-tap/contents/capigo.rb \
              -d "{\"message\":\"chore: remove stale Formula (Cask is canonical)\",\"sha\":\"$SHA\"}"
            echo "Deleted capigo.rb from tap"
          else
            echo "capigo.rb not found in tap, nothing to delete"
          fi
