name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Attach agent skill to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make skill-package
          gh release upload "${GITHUB_REF_NAME}" dist/capigo-api-skill.zip --clobber

      - name: Remove stale Formula from tap (Cask is canonical)
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          SHA=$(curl -sf -H "Authorization: token $TAP_GITHUB_TOKEN" \
            https://api.github.com/repos/vtech-com/homebrew-tap/contents/capigo.rb \
            | jq -r '.sha // empty')
          if [ -n "$SHA" ]; then
            curl -sf -X DELETE \
              -H "Authorization: token $TAP_GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/vtech-com/homebrew-tap/contents/capigo.rb \
              -d "{\"message\":\"chore: remove stale Formula (Cask is canonical)\",\"sha\":\"$SHA\"}"
            echo "Deleted capigo.rb from tap"
          else
            echo "capigo.rb not found in tap, nothing to delete"
          fi

  publish-skill-npm:
    name: Publish skill to npm
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build payload, version, and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."
            exit 0
          fi
          # Copy the canonical skill into the npm package payload (gitignored).
          rm -rf npm/skill
          mkdir -p npm/skill
          cp -r skills/capigo-api npm/skill/capigo-api
          # Version the package to match the release tag (strip leading "v").
          cd npm
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm publish --access public
