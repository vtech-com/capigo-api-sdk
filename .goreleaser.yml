version: 2

project_name: capigo

builds:
  - id: capigo
    binary: capigo
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/vtech-com/capigo-api-sdk/internal/version.Version={{.Version}}
      - -X github.com/vtech-com/capigo-api-sdk/internal/version.Commit={{.Commit}}
      - -X github.com/vtech-com/capigo-api-sdk/internal/version.Date={{.Date}}

archives:
  - id: capigo
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

nfpms:
  - id: capigo
    ids:
      - capigo
    package_name: capigo
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
    vendor: VTech
    homepage: "https://capigo.app"
    maintainer: "VTech <dev@capigo.app>"
    description: "CLI tool and Go SDK for the Capigo platform"
    license: MIT
    bindir: /usr/bin
    section: utils
    priority: optional

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

homebrew_casks:
  - repository:
      owner: vtech-com
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://capigo.app"
    description: "CLI tool and Go SDK for the Capigo platform"
    binary: "capigo"
    hooks:
      post:
        install: 'system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/capigo"]'

