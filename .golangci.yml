version: "2"

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - gosec

linters-settings:
  gofmt:
    simplify: true
  gosec:
    excludes:
      - G304  # file inclusion via variable — controlled paths only

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
